<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone - Shorts</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================================================
    HEADER
    ================================================== -->
    <header class="header">

        <!-- LEFT -->
        <div class="header-left">
            <button class="menu-btn" id="menuButton" title="Menu">
                ☰
            </button>

            <a href="index.html" class="youtube-logo">
                <span class="youtube-icon">▶</span>
                <span>YouTube</span>
            </a>
        </div>

        <!-- SEARCH -->
        <div class="search-container">
            <input id="searchInput" type="text" placeholder="Search">
            <button id="searchButton" class="search-btn" title="Search">
                🔍
            </button>
        </div>

        <!-- RIGHT -->
        <div class="header-right">
           <a href="create.html" class="header-icon-link" id="createButton" title="Create">
    ⊞
</a>
            <a href="notifications.html" class="header-icon" id="notificationButton" title="Notifications" style="text-decoration:none;color:inherit;">
    🔔
    <span class="notif-badge" id="notifBadge" style="display:none;">0</span>
<div class="header-right">
    <!-- Profile -->
    <a href="profile.html" class="profile-picture-link" id="profileButton" title="Account">
        <span class="profile-picture" id="headerAvatar">P</span>
    </a>
    
    <!-- Logout Button -->
    <button class="header-icon-link" id="logoutButton" title="Sign Out" onclick="logoutUser()">
        🚪
    </button>
</div>
        </div>

    </header>

    <!-- ==================================================
    SIDEBAR
    ================================================== -->
    <aside class="sidebar" id="sidebar">

        <!-- Main Navigation -->
        <a href="index.html" class="sidebar-item" data-page="home">
            <span class="sidebar-icon">⌂</span>
            <span class="sidebar-text">Home</span>
        </a>

        <a href="shorts-page.html" class="sidebar-item active" data-page="shorts">
            <span class="sidebar-icon">▶</span>
            <span class="sidebar-text">Shorts</span>
        </a>

        <a href="subscriptions.html" class="sidebar-item" data-page="subscriptions">
            <span class="sidebar-icon">▣</span>
            <span class="sidebar-text">Subscriptions</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- You -->
        <div class="sidebar-heading">
            <span class="sidebar-text">You</span>
        </div>

       <a href="channel.html" class="sidebar-item" data-page="channel">
    <span class="sidebar-icon">◉</span>
    <span class="sidebar-text">Your channel</span>
</a>

        <a href="history.html" class="sidebar-item" data-page="history">
            <span class="sidebar-icon">◷</span>
            <span class="sidebar-text">History</span>
        </a>

         <a href="your-videos.html" class="sidebar-item" data-page="your-videos">
            <span class="sidebar-icon">▣</span>
            <span class="sidebar-text">Your videos</span>
        </a>

        <a href="watch-later.html" class="sidebar-item" data-page="watch-later">
    <span class="sidebar-icon">◷</span>
    <span class="sidebar-text">Watch later</span>
</a>

        <a href="liked.html" class="sidebar-item" data-page="liked">
            <span class="sidebar-icon">♡</span>
            <span class="sidebar-text">Liked videos</span>
        </a>

        <div class="sidebar-divider"></div>

        <!-- Explore -->
<div class="sidebar-heading">
    <span class="sidebar-text">Explore</span>
</div>

<a href="explore.html?category=trending" class="sidebar-item" data-category="Trending">
    <span class="sidebar-icon">🔥</span>
    <span class="sidebar-text">Trending</span>
</a>

<a href="explore.html?category=music" class="sidebar-item" data-category="Music">
    <span class="sidebar-icon">♫</span>
    <span class="sidebar-text">Music</span>
</a>

<a href="explore.html?category=gaming" class="sidebar-item" data-category="Gaming">
    <span class="sidebar-icon">🎮</span>
    <span class="sidebar-text">Gaming</span>
</a>

<a href="explore.html?category=news" class="sidebar-item" data-category="News">
    <span class="sidebar-icon">📰</span>
    <span class="sidebar-text">News</span>
</a>

<a href="explore.html?category=sports" class="sidebar-item" data-category="Sports">
    <span class="sidebar-icon">⚽</span>
    <span class="sidebar-text">Sports</span>
</a>

<a href="explore.html?category=movies" class="sidebar-item" data-category="Movies">
    <span class="sidebar-icon">🎬</span>
    <span class="sidebar-text">Movies & TV</span>
</a>

    </aside>

    <!-- ==================================================
    MAIN CONTENT - SHORTS PAGE
    ================================================== -->
    <main class="main-content" id="mainContent">

        <div class="shorts-page-container">

            <!-- Shorts Player -->
            <div class="shorts-player-wrapper">
                <div class="shorts-player" id="shortsPlayer">
                    <div id="shortsYouTubePlayer" style="width:100%; height:100%;">
                        <iframe 
                            id="shortsIframe"
                            width="100%" 
                            height="100%" 
                            src="" 
                            title="YouTube Shorts player" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                            referrerpolicy="strict-origin-when-cross-origin" 
                            allowfullscreen>
                        </iframe>
                    </div>
                </div>

                <!-- Navigation Buttons -->
                <div class="shorts-nav">
                    <button class="shorts-nav-btn" id="prevShortBtn" title="Previous">
                        ↑
                    </button>
                    <button class="shorts-nav-btn" id="nextShortBtn" title="Next">
                        ↓
                    </button>
                </div>

                <!-- Shorts Info -->
                <div class="shorts-info-section">
                    <h2 class="shorts-title" id="shortsVideoTitle">Short Title</h2>
                    
                    <div class="shorts-channel-row">
                        <div class="shorts-channel-avatar" id="shortsChannelAvatar">C</div>
                        <div class="shorts-channel-details">
                            <h3 id="shortsChannelName">Channel Name</h3>
                            <p id="shortsViews">0 views</p>
                        </div>
                        <button class="shorts-subscribe-btn" id="shortsSubscribeBtn">
                            🔔 Subscribe
                        </button>
                    </div>

                    <!-- Action Buttons -->
                    <div class="shorts-actions">
                        <button class="shorts-action-btn" id="shortsLikeBtn">
                            👍 <span id="shortsLikeCount">0</span>
                        </button>
                        <button class="shorts-action-btn" id="shortsDislikeBtn">
                            👎 <span id="shortsDislikeCount">0</span>
                        </button>
                        <button class="shorts-action-btn" id="shortsShareBtn">
                            📤 Share
                        </button>
                    </div>
                </div>
            </div>

            <!-- Shorts List (sidebar) -->
            <div class="shorts-list">
                <h3>All Shorts</h3>
                <div id="shortsListGrid"></div>
            </div>

        </div>

    </main>

    <!-- ==================================================
    JAVASCRIPT
    ================================================== -->
    <script src="js/data.js"></script>
    <script src="js/shorts-page.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
