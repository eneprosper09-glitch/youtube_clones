<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Clone - Login</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- ==================================================
    HEADER
    ================================================== -->
    <header class="header">

        <!-- LEFT -->
        <div class="header-left">
            <a href="index.html" class="youtube-logo">
                <span class="youtube-icon">▶</span>
                <span>YouTube</span>
            </a>
        </div>

        <!-- RIGHT -->
        <div class="header-right">
            <a href="login.html" class="header-icon-link" id="loginBtn" title="Login">
                🔑
            </a>
        </div>

    </header>

    <!-- ==================================================
    MAIN CONTENT - LOGIN
    ================================================== -->
    <main class="login-main">

        <div class="login-container">

            <div class="login-box">
                <div class="login-logo">
                    <span class="youtube-icon">▶</span>
                    <span>YouTube</span>
                </div>
                <h2>Sign In</h2>
                <p>Sign in to access your channel and videos</p>

                <!-- Login Form -->
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="you@email.com" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input type="password" id="loginPassword" placeholder="Enter your password" class="form-input" required>
                    </div>

                    <button type="submit" class="login-btn">Sign In</button>
                </form>

                <p class="signup-text">
                    Don't have an account? <a href="#" id="showSignup">Sign Up</a>
                </p>
            </div>

            <!-- Sign Up Box -->
            <div class="login-box" id="signupBox" style="display:none;">
                <div class="login-logo">
                    <span class="youtube-icon">▶</span>
                    <span>YouTube</span>
                </div>
                <h2>Sign Up</h2>
                <p>Create your account to get started</p>

                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" placeholder="Your Name" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input type="email" id="signupEmail" placeholder="you@email.com" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input type="password" id="signupPassword" placeholder="Create a password" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label for="signupHandle">Channel Handle (without @)</label>
                        <input type="text" id="signupHandle" placeholder="yourchannel" class="form-input" required>
                    </div>

                    <button type="submit" class="login-btn">Create Account</button>
                </form>

                <p class="signup-text">
                    Already have an account? <a href="#" id="showLogin">Sign In</a>
                </p>
            </div>

        </div>

    </main>

    <!-- ==================================================
    JAVASCRIPT
    ================================================== -->
    <script src="js/login.js"></script>

</body>

</html>
